name: Vellum Enhanced Core Artifacts

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vellum-enhanced-core-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            archive: enhanced-codex-core-x86_64-pc-windows-msvc.zip
          # rusty_v8's x86_64 static archive must be linked by an x86_64 host.
          # Match the upstream Codex release workflow instead of cross-linking
          # it on the arm64 macos-14 runner.
          - runner: macos-15-xlarge
            target: x86_64-apple-darwin
            archive: enhanced-codex-core-x86_64-apple-darwin.tar.gz
          - runner: macos-14
            target: aarch64-apple-darwin
            archive: enhanced-codex-core-aarch64-apple-darwin.tar.gz
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out pinned source
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}

      - name: Ensure target standard library is installed
        run: rustup target add --toolchain 1.95.0 ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: codex-rs
          key: vellum-${{ matrix.target }}
          # The Codex workspace is an hour of compute before this job reaches
          # its first artifact. A failure in a later step should not throw that
          # away and make the next attempt pay for it again.
          cache-on-failure: true

      - name: Build Codex core
        working-directory: codex-rs
        run: cargo build --release --locked --target ${{ matrix.target }} -p codex-cli

      - name: Build Vellum Remote Control relay
        working-directory: codex-rs
        run: cargo build --release --locked --target ${{ matrix.target }} -p codex-app-server --bin vellum-codex-relay

      - name: Build Windows sandbox helpers
        if: runner.os == 'Windows'
        working-directory: codex-rs
        run: cargo build --release --locked --target ${{ matrix.target }} -p codex-windows-sandbox --bin codex-windows-sandbox-setup --bin codex-command-runner

      # `codex-code-mode-runtime` turns on the v8 crate's `v8_enable_sandbox`
      # feature, and denoland publishes no prebuilt archive for that variant.
      # Codex publishes its own; without this step the next step 404s and tells
      # you to build V8 from source.
      - name: Resolve Codex-built V8 artifacts
        shell: bash
        run: |
          python=python3
          command -v python3 >/dev/null 2>&1 || python=python
          "$python" .github/scripts/resolve_codex_v8.py '${{ matrix.target }}' >> "$GITHUB_ENV"

      # rust-cache can restore Cargo's V8 build-script fingerprint without the
      # large native archive placed outside Cargo's package output directory.
      # Cleaning only this dependency guarantees that its build script copies
      # the verified Codex archive into the linker search directory.
      - name: Reset cached V8 build state
        working-directory: codex-rs
        run: cargo clean --release --target ${{ matrix.target }} -p v8

      - name: Build code mode host
        working-directory: codex-rs
        run: cargo build --release --locked --target ${{ matrix.target }} -p codex-code-mode-host

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $release = 'codex-rs/target/${{ matrix.target }}/release'
          Compress-Archive -LiteralPath @(
            "$release/codex.exe",
            "$release/codex-windows-sandbox-setup.exe",
            "$release/codex-command-runner.exe",
            "$release/codex-code-mode-host.exe",
            "$release/vellum-codex-relay.exe"
          ) -DestinationPath '${{ matrix.archive }}'

      - name: Package macOS artifact
        if: runner.os == 'macOS'
        run: |
          tar -czf '${{ matrix.archive }}' \
            -C 'codex-rs/target/${{ matrix.target }}/release' \
            codex codex-code-mode-host vellum-codex-relay

      - name: Upload platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish immutable artifact set
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*-*-*'
          path: dist
          merge-multiple: true

      - name: Write checksums
        working-directory: dist
        run: sha256sum enhanced-codex-core-* > SHA256SUMS

      - name: Publish commit-addressed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="vellum-core-${GITHUB_SHA}"
          gh release create "$tag" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Vellum Enhanced Core ${GITHUB_SHA}" \
            --notes "Enhanced Codex Core artifacts built from commit ${GITHUB_SHA}. SHA-256 values are recorded in SHA256SUMS."
